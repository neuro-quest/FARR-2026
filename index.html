<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F3FC">
<title>Проверь себя — Nutricia</title>
<style>
  :root{
    --bg:#F7F3FC; --primary:#6D2E8C; --primary-d:#55217A; --soft:#EFE6F8; --line:#DDCBEE;
    --ink:#17141C; --muted:#6B6378; --card:#fff;
    --gold1:#FBE7AC; --gold2:#E2B443; --gold-ink:#6B4600;
    --silver1:#F4F5F9; --silver2:#C9CEDC; --silver-ink:#3B4252;
    --ok:#2E8B57; --err:#C0392B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
  .app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .app.wide-app{max-width:760px}
  .logo{height:46px;margin-bottom:12px;display:flex;align-items:center}
  .logo img{height:100%;width:auto}
  .logo .ph{height:46px;padding:0 14px;border:1.5px dashed #9B7FB0;border-radius:8px;display:flex;align-items:center;font-size:12px;color:#7A5F8E}
  main{flex:1;display:flex;flex-direction:column}
  h1{font-size:21px;margin:0 0 14px}
  h2{font-size:18px;margin:0 0 10px}
  p{font-size:16px;line-height:1.45;margin:0 0 14px}
  .small{font-size:13px;color:var(--muted);line-height:1.35}
  ol,ul{padding-left:22px;margin:0 0 14px;font-size:16px;line-height:1.45}
  li{margin-bottom:6px}
  .spacer{flex:1;min-height:16px}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .badge{flex:none;background:var(--primary);color:#fff;border-radius:16px;padding:8px 14px;font-weight:700;font-size:15px;text-align:center;line-height:1.15;white-space:nowrap}
  .badge.gold{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--gold-ink)}
  .btn{display:block;width:100%;border:1.5px solid var(--line);border-radius:18px;padding:17px;font-size:19px;
    background:#fff;color:var(--primary-d);font-family:inherit;cursor:pointer;margin-top:10px;font-weight:600}
  .btn.primary{background:linear-gradient(135deg,var(--primary),#9B40A6);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(109,46,140,.28)}
  .btn.ghost{font-size:15px;padding:12px}
  .btn:disabled{opacity:.5}
  .row{display:flex;gap:10px}
  .msg{font-size:14px;margin:8px 2px;min-height:18px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  /* прогресс вопросов */
  .steps{display:flex;gap:6px;margin-bottom:16px}
  .steps i{flex:1;height:8px;border-radius:5px;background:#fff}
  .steps i.on{background:linear-gradient(90deg,var(--primary),#B455B0)}
  /* варианты ответа */
  .opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #fff;border-radius:18px;
    padding:16px;font-size:16px;font-family:inherit;color:inherit;cursor:pointer;margin-bottom:10px;line-height:1.35}
  .opt.sel{border-color:var(--primary)}
  .opt.right{border-color:var(--ok);background:#EAF6EF}
  .opt.wrong{border-color:var(--err);background:#FBECEA}
  .opt:disabled{cursor:default}
  /* плашки */
  .wide{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;
    color:inherit;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:14px;margin-top:12px;cursor:pointer;text-decoration:none}
  .wide .ic{width:42px;height:42px;border-radius:13px;flex:none;background:var(--soft);display:flex;align-items:center;justify-content:center}
  .wide .ic svg{width:24px;height:24px;fill:none;stroke:var(--primary-d);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .wide b{font-size:15px;line-height:1.25;display:block}
  .tile{position:relative;display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px;margin-bottom:12px;overflow:hidden}
  .tile .ic{width:48px;height:48px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55)}
  .tile .ic svg{width:28px;height:28px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tile .n{font-size:12px;font-weight:800;letter-spacing:.06em;opacity:.85}
  .tile .v{font-size:17px;font-weight:700;line-height:1.2}
  .tile .d{font-size:13px;line-height:1.3;margin-top:3px}
  .tile.silver{background:linear-gradient(135deg,var(--silver1),var(--silver2));color:var(--silver-ink);box-shadow:0 4px 14px rgba(120,130,160,.25)}
  .tile.silver .ic svg{stroke:var(--silver-ink)}
  .tile.gold{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--gold-ink);box-shadow:0 6px 18px rgba(226,180,67,.45)}
  .tile.gold .ic svg{stroke:var(--gold-ink)}
  .tile.purple{background:linear-gradient(135deg,var(--primary),#9B40A6);color:#fff;box-shadow:0 6px 16px rgba(109,46,140,.28)}
  .tile.purple .ic{background:rgba(255,255,255,.22)} .tile.purple .ic svg{stroke:#fff}
  .tile.gray{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .tile.gray .ic{background:var(--soft)} .tile.gray .ic svg{stroke:var(--primary-d)}
  .tile.gold.shine::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
    background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);
    background-size:300% 100%;animation:shine 3.4s ease-in-out infinite}
  @keyframes shine{0%{background-position:160% 0}55%,100%{background-position:-60% 0}}
  .code{font-size:30px;font-weight:800;letter-spacing:.12em;margin-top:4px}
  .expl{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:14px;font-size:15px;line-height:1.45}
  .expl b.ok{color:var(--ok)} .expl b.err{color:var(--err)}
  .symp{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px}
  .symp .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
  .chip{background:var(--soft);color:var(--primary-d);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
  .talk{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--soft);font-size:15px;line-height:1.35}
  .talk .num{flex:none;width:24px;height:24px;border-radius:8px;background:var(--primary);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .talk .spk{display:block;margin-top:3px;font-size:13px;font-weight:700;color:var(--primary-d)}
  .expert{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
  .expert .ava{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:50% 20%;flex:none;
    border:3px solid #fff;box-shadow:0 0 0 2px var(--gold2),0 6px 16px rgba(109,46,140,.18);background:#fff}
  .expert .n{font-weight:800;font-size:17px;line-height:1.2}
  .expert .r{font-size:13px;color:var(--muted);margin-top:2px}
  .expert .q{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--gold-ink);border-radius:999px;padding:3px 9px}
  .say{display:flex;align-items:flex-end;gap:12px;margin:6px 0 16px}
  .say .ava{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:50% 20%;flex:none;
    border:3px solid #fff;box-shadow:0 0 0 2px var(--gold2),0 6px 16px rgba(109,46,140,.18);background:#fff}
  .bubble{position:relative;flex:1;background:#fff;border-radius:20px 20px 20px 6px;padding:14px 16px;font-size:17px;font-weight:600;line-height:1.4;
    box-shadow:0 4px 14px rgba(109,46,140,.1)}
  .bubble::before{content:"";position:absolute;left:-10px;bottom:10px;border:10px solid transparent;border-right-color:#fff;border-left:0}
  .bubble .who{font-size:12px;font-weight:800;color:var(--primary-d);margin-bottom:6px;line-height:1.3}
  .bubble .who span{display:block;font-weight:600;color:var(--muted)}
  .expl-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
  .ava-s{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 20%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--gold2)}
  .expl.bubble-l{margin:0;border-radius:6px 18px 18px 18px;flex:1}
  .expl .who{font-size:12px;font-weight:800;color:var(--primary-d);margin-bottom:4px}
  .pid{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
  .toast{position:fixed;left:50%;top:24px;transform:translateX(-50%) scale(.9);background:var(--ok);color:#fff;
    border-radius:18px;padding:16px 26px;font-weight:800;font-size:22px;opacity:0;
    transition:opacity .35s, transform .35s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 26px rgba(46,139,87,.4);pointer-events:none;z-index:9;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) scale(1)}
  .toast.info{background:var(--primary)}
  .conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:8;animation:fall linear forwards}
  @keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:.1;transform:translateY(100vh) rotate(720deg)}}
  /* панель организатора */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:#fff;border-radius:16px;padding:12px 14px}
  .kpi b{display:block;font-size:26px;color:var(--primary)}
  .kpi span{font-size:13px;color:var(--muted)}
  .panel{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px}
  .panel h2{margin-bottom:8px}
  .wl{list-style:none;padding:0;margin:8px 0 0}
  .wl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--soft);font-size:15px}
  .wl .c{font-weight:800;letter-spacing:.08em;min-width:64px}
  .wl .t{color:var(--muted);font-size:13px;flex:1}
  .ok-t{color:var(--ok);font-weight:700}
  .seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin:8px 0}
  .seg button{flex:1;border:0;border-radius:10px;padding:10px;font-family:inherit;font-size:14px;font-weight:700;background:transparent;color:var(--primary-d);cursor:pointer}
  .seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .mode{font-size:13px;padding:8px 12px;border-radius:12px;background:#FFF4D6;margin-bottom:12px;line-height:1.35}
  .mode.on{background:#DFF3EA}
  .qr-over{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .qr-over h1{font-size:clamp(22px,4vw,44px)}
  .qr-over .qrbox{background:#fff;padding:18px;border-radius:24px;box-shadow:0 6px 24px rgba(109,46,140,.15)}
  .qr-over .small{margin-top:14px;word-break:break-all}
  a.link{color:var(--primary-d);word-break:break-all}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===================================================================
   НАСТРОЙКИ — здесь меняются тексты, вопросы, призы и время
   Всё, что в [квадратных скобках], — заглушки для заполнения.
   =================================================================== */
const CONFIG = {
  eventName: 'ФАРР-2026',
  logo: 'logo.png',

  // Электронный справочник Nutricia — бонус для всех на этапе 1
  guideUrl: 'https://drive.google.com/drive/folders/1QDOL7z5uqaZoPXevC9cFcXg2Sp6W2xtt?usp=drive_link',

  symposium: {
    title: 'От нутритивной поддержки к метаболической терапии: возможности новой линейки энтерального питания в ОРИТ',
    date: '1 ноября (вс)',
    time: '11:45–12:45',
    hall: 'зал Е10–Е12',
    talks: [
      { title: 'Как остановить потерю мышечной массы у критического пациента?', speaker: 'Ершов В. И.' },
      { title: 'Гастростаз не повод для голодания: современные подходы к обеспечению энтерального питания в ОРИТ', speaker: 'Симутис И. С.' },
      { title: 'Белок как инструмент интенсивной терапии: новая парадигма энтерального питания в ОРИТ', speaker: 'Пасечник И. Н.' }
    ],
    // Окно, когда работает квиз этапа 2 (время московское)
    start: '2026-11-01T11:30:00+03:00',
    end:   '2026-11-01T13:15:00+03:00'
  },

  /* ---------- ЭТАП 1. «Проверь себя» (до симпозиума) ---------- */
  stage1: {
    // Клиническая задачка. correct — номер правильного варианта, считая с нуля.
    // Эксперт, от имени которого задаётся вопрос (фото — файл рядом с index.html)
    expert: { name: 'Пасечник И. Н.', role: 'Модератор симпозиума Nutricia', photo: 'expert.jpg' },
    question: 'Назовите лучшие парикмахерские в СПб',
    options: ['[Вариант ответа 1]', '[Вариант ответа 2]', '[Вариант ответа 3]'],
    correct: 0,
    explanation: '[Короткое пояснение от медицинского советника: почему верен этот ответ]',
    // Приз за правильный ответ — ограниченное количество в день
    prize: 'ежедневник Nutricia',
    limitPerDay: { '2026-10-31': 65, '2026-11-01': 65, default: 65 }, // default — для проверки в другие дни
    claimUntil: 'до 18:00 сегодня'
  },

  /* ---------- ЭТАП 2. Квиз на симпозиуме ---------- */
  stage2: {
    // Ключ в QR-коде зала. Без него квиз не откроется.
    key: 'farr26zal',
    // false — квиз открыт всегда (для проверки). ПЕРЕД КОНГРЕССОМ поставить true.
    checkTime: false,
    winners: 8,
    prize: 'специализированное пособие для реаниматолога',
    // Вариант выбора победителей можно переключить и в панели организатора:
    // 'raffle' — розыгрыш среди всех, кто ответил верно на все вопросы
    // 'speed'  — самые быстрые среди ответивших верно (время от открытия 1-го вопроса до отправки)
    winnerMode: 'raffle',
    questions: [
      { q: '[Вопрос 1 — от медицинского советника]', options: ['[Вариант 1]', '[Вариант 2]', '[Вариант 3]'], correct: 0 },
      { q: '[Вопрос 2 — от медицинского советника]', options: ['[Вариант 1]', '[Вариант 2]', '[Вариант 3]'], correct: 1 },
      { q: '[Вопрос 3 — от медицинского советника]', options: ['[Вариант 1]', '[Вариант 2]', '[Вариант 3]'], correct: 2 }
    ]
  }
};

// Конфиг Firebase (Project settings → Your apps → Web). Пока пусто — локальный режим:
// всё работает только во вкладках одного браузера, для проверки сценария.
const firebaseConfig = {
  // apiKey: "...", authDomain: "...", databaseURL: "https://....firebasedatabase.app", projectId: "...", appId: "..."
};
/* =================== конец настроек =================== */

const P = new URLSearchParams(location.search);
const MODE = P.get('mode') === 'admin' ? 'admin' : (P.get('s') === '2' ? 'stage2' : 'stage1');
const BASE_URL = location.origin + location.pathname;
const STAGE2_URL = BASE_URL + '?s=2&k=' + encodeURIComponent(CONFIG.stage2.key);
const ROOT = 'farr2026';

/* ---------- общее хранилище: Firebase или локально ---------- */
let store;
if (firebaseConfig.databaseURL) {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database(), root = db.ref(ROOT);
  let offset = 0;
  db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
  store = {
    online: true,
    subscribe(cb){ root.on('value', s => cb(s.val() || {})); },
    set(path, val){ return root.child(path).set(val); },
    async inc(path, limit){ // атомарно занять одно место из лимита
      const r = await root.child(path).transaction(v => { v = v || 0; if (v >= limit) return; return v + 1; });
      return r.committed;
    },
    now(){ return Date.now() + offset; }
  };
} else {
  const KEY = 'quiz2_local_' + ROOT, subs = [];
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } };
  const emit = () => { const d = read(); subs.forEach(f => f(d)); };
  window.addEventListener('storage', e => { if (e.key === KEY) emit(); });
  const write = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} emit(); };
  const get = (o, path) => path.split('/').reduce((a, k) => a && a[k], o);
  const put = (o, path, val) => {
    const p = path.split('/'); let x = o;
    for (let i = 0; i < p.length - 1; i++) { if (typeof x[p[i]] !== 'object' || !x[p[i]]) x[p[i]] = {}; x = x[p[i]]; }
    if (val === null) delete x[p[p.length-1]]; else x[p[p.length-1]] = val;
  };
  store = {
    online: false,
    subscribe(cb){ subs.push(cb); cb(read()); },
    set(path, val){ const d = read(); put(d, path, val); write(d); return Promise.resolve(); },
    inc(path, limit){ const d = read(); const v = get(d, path) || 0; if (v >= limit) return Promise.resolve(false); put(d, path, v + 1); write(d); return Promise.resolve(true); },
    now(){ return Date.now(); }
  };
}

/* ---------- состояние устройства врача ---------- */
const LKEY = 'quiz2_me';
let S;
function loadMe(){
  if (P.has('reset')) { try { localStorage.removeItem(LKEY); } catch(e){} }
  try { S = JSON.parse(localStorage.getItem(LKEY)); } catch(e){ S = null; }
  if (!S || !S.pid) S = { pid: (Date.now().toString(36) + Math.random().toString(36).slice(2,6)).toUpperCase(), s1:{}, s2:{sel:{}} };
  S.s1 = S.s1 || {}; S.s2 = S.s2 || { sel:{} }; S.s2.sel = S.s2.sel || {};
  saveMe();
}
function saveMe(){ try { localStorage.setItem(LKEY, JSON.stringify(S)); } catch(e){} }
const claimCode = pid => pid.slice(-4);

/* ---------- утилиты ---------- */
let D = {};
let screen = '';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mskDay = t => new Date(t + 3 * 3600e3).toISOString().slice(0, 10);
const SYMP = { start: new Date(CONFIG.symposium.start).getTime(), end: new Date(CONFIG.symposium.end).getTime() };
function sympState(){ const n = store.now(); return n < SYMP.start ? 'soon' : n <= SYMP.end ? 'live' : 'closed'; }
function stage2Open(){ return !CONFIG.stage2.checkTime || sympState() === 'live'; }
const winnerMode = () => (D.s2 && D.s2.settings && D.s2.settings.mode) || CONFIG.stage2.winnerMode;

const I = {
  quiz:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>',
  mic:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8M7 9h6M7 12h10"/></svg>',
  gift:'<svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="1"/><path d="M3 13h18M12 9v12M12 9c-2-4-6-4-6-1.5S10 9 12 9zm0 0c2-4 6-4 6-1.5S14 9 12 9z"/></svg>',
  book:'<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M12 8v6m0 0l-2.2-2.2M12 14l2.2-2.2"/></svg>',
  books:'<svg viewBox="0 0 24 24"><path d="M4 19V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v14M9 19V7a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v12M14.5 8.5l2.9-.8a1 1 0 0 1 1.2.7l2.6 9.7M3 19h18"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  check:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>',

function confetti(){
  const colors = ['#E2B443','#6D2E8C','#B455B0','#2E8B57','#F7D77A','#9B40A6'];
  for (let i = 0; i < 46; i++) {
    const c = document.createElement('div');
    c.className = 'conf'; c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (2.2 + Math.random() * 1.4) + 's';
    c.style.animationDelay = (Math.random() * .5) + 's';
    if (i % 3 === 0) c.style.borderRadius = '50%';

}

function setMode(m){ store.set('s2/settings/mode', m); }
function draw(){
  const el = eligible(), n = CONFIG.stage2.winners, mode = winnerMode();
  if (!el.length) return toast('Пока нет участников с верными ответами', 'info', false);
  if (winners() && !confirm('Победители уже определены. Определить заново?')) return;
  let list;
  if (mode === 'speed') list = el.sort((a, b) => a.dur - b.dur || a.finish - b.finish).slice(0, n).map(x => x.id);
  else {
    const arr = el.map(x => x.id), r = new Uint32Array(arr.length);
    crypto.getRandomValues(r);
    for (let i = arr.length - 1; i > 0; i--) { const j = r[i] % (i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    list = arr.slice(0, n);
  }
  store.set('s2/winners', { mode, at: store.now(), list });
  toast('Победители определены');
}
function resetAll(){
  if (!confirm('Удалить все ответы, брони и победителей?')) return;
  store.set('s1', null); store.set('s2', null);
  try { localStorage.removeItem(LKEY); } catch(e){}
}
function showQr(n){
  qrShown = n;
  const url = n === 1 ? BASE_URL : STAGE2_URL;
  const box = document.createElement('div');

  box.innerHTML = logo() + '<h1>' + (n === 1 ? 'Проверьте себя: одна клиническая задачка' : 'Квиз симпозиума — сканируйте QR') + '</h1>' +

    '<button class="btn" style="max-width:320px" onclick="this.parentNode.remove()">Закрыть</button>';
  document.body.appendChild(box);
  const size = Math.min(innerWidth, innerHeight) * 0.55;
  new QRCode($('qr'), { text: url, width: size, height: size, colorDark: '#55217A' });
}

}

  screen = pickScreen();
